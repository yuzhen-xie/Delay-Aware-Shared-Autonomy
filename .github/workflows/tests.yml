name: Source archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: physical-experiment-source
          path: |
            src/
            configs/
            study/
            scripts/
            README.md
            pyproject.toml
            requirements.lock
            requirements-hardware.txt
          if-no-files-found: error
