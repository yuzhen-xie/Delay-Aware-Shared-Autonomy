[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delay-aware-shared-autonomy"
version = "0.4.0"
description = "Measured human-robot experiments in delayed intent inference and shared control"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5", "scipy==1.17.0", "torch==2.6.0",
  "matplotlib==3.10.8", "PyYAML==6.0.3"
]

[project.optional-dependencies]
dev = ["ruff==0.14.1"]
hardware = ["ur-rtde==1.6.2", "pyrealsense2==2.56.5.9235", "opencv-python==4.13.0.92"]

[project.scripts]
dasa = "dasa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
