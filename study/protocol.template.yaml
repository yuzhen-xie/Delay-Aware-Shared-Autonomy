schema_version: 3
record_status: prospective
data_provenance: actual_participant_measurement
study_id: dasa-study-v2
design: within_subjects
expected_participants: 20
conditions: [C1, C2, C3, C4]
feedback_delays_seconds: [0.0, 0.4, 0.8, 1.5]
command_delay_seconds: 0.0
tlx_delays_seconds: [0.8]
workload_figure_delay_seconds: 0.8
trial_timeout_seconds: 60.0
timing_tolerance_seconds: 0.02
practice_trials: 8
practice_trial_timeout_seconds: 60.0
practice_sequence: [[C1, 0.0], [C1, 0.0], [C1, 0.0], [C1, 0.0], [C3, 0.0], [C3, 0.0], [C3, 0.0], [C3, 0.0]]
randomization_seed: 20261014
trial_repeats_per_participant_condition_delay: 1
scoring:
  success: correct_goal_grasp_lift_and_place_before_timeout_without_collision_or_bounds_violation
  completion_seconds: start_to_valid_place_for_successful_trials
  safety_index: duration_weighted_mean_exp_negative_gamma_speed_squared_over_surface_clearance
  stability_index: duration_weighted_mean_exp_negative_absolute_gamma_second_speed_derivative
  minimum_clearance_m: minimum_TCP_surface_clearance_over_the_entire_trial
  jerk_rms: RMS_norm_of_translational_jerk_in_metres_per_second_cubed
  timeout_penalized_seconds: completion_time_if_success_else_declared_timeout
exclusion_rules:
  excluded: [practice, documented_device_fault, documented_corrupt_record, participant_not_included]
  retained_as_failures: [collision, bounds_violation, wrong_goal, timeout]
primary_outcomes: [success_rate, completion_seconds]
secondary_outcomes: [safety_index, stability_index, minimum_clearance_m, jerk_rms, timeout_penalized_seconds]
unit_of_analysis: participant
test: paired_two_sided_sign_permutation
multiple_comparison_correction: Holm
confidence_intervals: paired_participant_bootstrap_95_percent_pointwise
task_family: all_conditions_delays_and_task_metrics
workload_family: RTLX_and_six_scales_all_conditions_and_declared_TLX_delays
missingness: retain_failures_in_success_rate_and_report_success_conditioned_time
questionnaire:
  scale_min: 1.0
  scale_max: 7.0
  performance_direction: higher_is_worse
  anchors:
    mental: {low: very_low_mental_demand, high: very_high_mental_demand}
    physical: {low: very_low_physical_demand, high: very_high_physical_demand}
    temporal: {low: very_low_time_pressure, high: very_high_time_pressure}
    performance: {low: perfect_performance, high: task_failure}
    effort: {low: very_low_effort, high: very_high_effort}
    frustration: {low: very_low_frustration, high: very_high_frustration}
